name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run parser test suite
        run: node --test test/

      # 版本号写在三个文件里（tag 决定 Release 资产名，Tauri 又会把版本号烙进安装包），
      # 不一致时发出来的安装包会标着一个从未存在过的版本号，且没有别的地方会发现。
      - name: Version numbers must agree
        run: node scripts/check-versions.js

      # `node --test test/` recurses, so a browser suite dropped under test/ would be
      # picked up by this Playwright-less job and fail. Keep those in test-browser/.
      - name: test/ must not require a browser
        run: |
          if grep -rln "require('playwright')" test/; then
            echo "::error::Playwright suites belong in test-browser/, not test/."
            exit 1
          fi

      - name: Build the standalone single-file editor
        run: |
          node build-standalone.js
          test -f LuoguMarkdownEditor.html
          echo "Built $(wc -c < LuoguMarkdownEditor.html) bytes."

      - name: Artifact must be fully self-contained
        run: |
          if grep -qn 'src="src/\|href="src/\|src="assets/\|href="assets/' LuoguMarkdownEditor.html; then
            echo "::error::Artifact still references external files; it would break offline."
            exit 1
          fi
          echo "No unresolved external references."

      - name: Check for external CDN references
        run: |
          if grep -rn "cdn\.jsdelivr\|unpkg\.com\|cdnjs\.cloudflare" index.html src/; then
            echo "::error::Found an external CDN reference; the app must stay fully offline."
            exit 1
          fi
          echo "No external CDN references."

      - name: index.html must stay a thin shell
        run: |
          # The dev shell is plain markup that references src/ and assets/. If a huge
          # inlined blob creeps back in, the two HTML files can silently drift apart
          # again (which is exactly how index.html ended up shipping a stale parser).
          size=$(wc -c < index.html)
          echo "index.html is $size bytes"
          if [ "$size" -gt 200000 ]; then
            echo "::error::index.html is $size bytes - it should reference src/ and assets/, not inline them."
            exit 1
          fi
          if grep -qi "@font-face" index.html; then
            echo "::error::index.html contains inlined font CSS; it must link assets/katex/katex.min.css instead."
            exit 1
          fi

      - name: Build must be idempotent
        run: |
          node build-standalone.js
          a=$(md5sum LuoguMarkdownEditor.html | cut -d' ' -f1)
          node build-standalone.js
          b=$(md5sum LuoguMarkdownEditor.html | cut -d' ' -f1)
          if [ "$a" != "$b" ]; then
            echo "::error::build-standalone.js is not idempotent ($a vs $b)."
            exit 1
          fi
          echo "Build is idempotent."

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build
        run: node build-standalone.js

      # These run against the real artifact in a real browser, which is the only
      # place the security properties actually hold or fail: escaping bugs only
      # show up once the HTML is parsed by a browser.
      - name: XSS regression suite
        run: node test-browser/xss.test.js

      - name: Rendering fidelity suite
        run: node test-browser/fidelity.test.js

      - name: Robustness / ReDoS suite
        run: node test-browser/robustness.test.js

      - name: List continuation suite
        run: |
          node test-browser/list-continuation.test.js
          node test-browser/list-edge.test.js

      - name: Scroll sync suite
        run: |
          node test-browser/scroll-top.test.js
          node test-browser/code-hscroll.test.js

      # A favicon is fetched as an image (strict XML), unlike inline SVG in HTML
      # (lenient). A malformed icon therefore looks fine in a page and silently
      # fails in the tab, so it has to be decoded the way a browser does.
      - name: App icon suite
        run: node test-browser/favicon.test.js

      - name: Heading suite
        run: node test-browser/heading.test.js

      # Shortcuts are dispatched as real key events: this catches both a handler
      # that never fires and a missing preventDefault (Ctrl+D/Ctrl+1.. are claimed
      # by the browser), plus collisions such as Ctrl+I swallowing Ctrl+Shift+I.
      - name: Keyboard shortcuts suite
        run: node test-browser/shortcuts.test.js

      # Typora mode swaps rendered blocks for their Markdown source in place. The
      # risk is source-range drift: committing a block must not shift the line count
      # or clobber neighbouring blocks, which only shows up end-to-end.
      - name: Typora mode suite
        run: node test-browser/typora.test.js

      # Toolbar inserts, the scroll-sync toggle and Ctrl+S. Saving in particular is
      # easy to regress into "always re-download a copy" instead of writing back to
      # the opened file.
      - name: Workspace behaviour suite
        run: node test-browser/workspace.test.js

      # Long-image export. The capture temporarily mutates the preview pane, so this
      # guards both the picture (complete, no scrollbars, callouts open) and that the
      # page is left exactly as it was.
      - name: Long-image export suite
        run: node test-browser/export-image.test.js

      # Paging markers drive PDF/print and split the long image. The export mutates
      # the live preview, so this also guards that it is restored.
      - name: Pagination suite
        run: node test-browser/pagination.test.js

      # The workspace panel is desktop-only but ships in the same HTML, so this
      # guards both that it stays invisible in a browser and that it works when a
      # native filesystem is present (stubbed here — no Rust toolchain needed).
      - name: Workspace panel suite
        run: node test-browser/workspace-panel.test.js

  # 发布流程本身也得有人看着。workflow 文件里的错误通常要等到打 tag 那一刻才暴露，
  # 而那正是最不想出岔子的时候；actionlint 会顺带用 shellcheck 检查所有 run: 块，
  # 上面那几个"产物必须自包含"的校验脚本也在其中。
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the workflow files
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check the launcher
        run: python -m py_compile app.py
      - name: Ensure the server does not bind all interfaces
        run: |
          if grep -n '"0\.0\.0\.0"\|'"'"'0\.0\.0\.0'"'"'' app.py; then
            echo "::error::app.py must bind to loopback only."
            exit 1
          fi
          echo "Launcher binds to loopback only."
