name: Desktop

# Kept separate from CI on purpose. A three-platform Rust build takes tens of
# minutes and depends on system toolchains; folding it into the main CI would turn
# a two-minute feedback loop into a slow, flaky one. This runs only when asked, or
# when a release tag is cut.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Temporary while the spike branch is open, so each push proves the three
    # platforms still build. Remove this line before merging to main.
    branches: ['feat/desktop-tauri']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The desktop app ships the very same artifact the web build produces, so it
      # is built here rather than vendored — the two cannot drift apart.
      - name: Build the single-file editor
        run: node build-standalone.js

      - name: Stage it as the desktop frontend
        run: node scripts/stage-desktop-frontend.js

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build the application
        working-directory: desktop
        run: npx tauri build

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          # Copy whatever this platform produced; the set of bundle formats differs
          # per OS, so match loosely rather than naming exact files.
          find desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \
               -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out/ || echo "no bundles found"

      # Portable build: the bare executable plus the marker file that makes it keep
      # its data (drafts, recent files) in its own folder instead of the user
      # profile. That is the whole point of a green/portable copy — it has to
      # survive being carried to another machine on a stick.
      - name: Assemble the portable package
        shell: bash
        run: |
          mkdir -p portable
          case "${{ matrix.label }}" in
            windows) cp "desktop/src-tauri/target/release/luogu-markdown-editor.exe" portable/ ;;
            linux)   cp "desktop/src-tauri/target/release/luogu-markdown-editor" portable/ ;;
            macos)   cp -R desktop/src-tauri/target/release/bundle/macos/*.app portable/ 2>/dev/null || \
                     cp "desktop/src-tauri/target/release/luogu-markdown-editor" portable/ ;;
          esac
          printf '%s\n' \
            '这个文件让编辑器以便携模式运行：' \
            '草稿、最近打开记录等数据会写入同目录的 data/ 文件夹，' \
            '而不是系统用户目录。删除本文件即恢复为普通模式。' \
            > portable/portable.txt
          ls -lh portable/

      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.label }}
          path: portable/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: out/*
          if-no-files-found: error
