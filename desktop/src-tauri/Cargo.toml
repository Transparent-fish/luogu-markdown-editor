[package]
name = "luogu-markdown-editor"
version = "1.34.0"
description = "洛谷 Markdown & KaTeX 编辑器桌面版"
authors = ["wudream813"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
# The editor is one big HTML file; the Rust side is a thin shell, so optimise the
# binary for size rather than speed.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
